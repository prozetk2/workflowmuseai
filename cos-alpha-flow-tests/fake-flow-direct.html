<!doctype html><html><head><meta charset="utf-8"><title>Fake Flow (Tác nhân off)</title>
<style>
body{margin:0;font:14px sans-serif;background:#111;color:#eee}
#grid{position:fixed;left:0;top:0;right:0;height:60vh;overflow:auto;display:flex;flex-wrap:wrap;gap:8px;padding:8px}
flow-grid-tile-container{display:block;width:160px;height:200px;background:#222;position:relative}
flow-grid-tile-container img,flow-grid-tile-container video{width:160px;height:180px;object-fit:cover}
flow-prompt-box{position:fixed;left:25vw;bottom:20px;width:50vw;background:#222;padding:8px;display:block}
#box{min-height:40px;background:#000;padding:6px}
#atts img{width:48px;height:48px}
.cdk-overlay-container{position:fixed;left:30vw;bottom:140px}
flow-prompt-box-settings{display:block;background:#333;padding:8px;width:320px}
#menu{position:fixed;left:26vw;bottom:150px;background:#444;padding:8px;display:none}
button{margin:2px}
</style></head><body>
<header style="position:fixed;top:0;right:0;z-index:5"><button id="gear" aria-label="Cài đặt"><mat-icon>settings_2</mat-icon></button></header>
<div id="gearMenu" style="display:none;position:fixed;top:40px;right:0;background:#333;padding:8px;z-index:6"><div class="row"><span>Trả về video không có âm thanh</span><button role="switch" id="silentSwitch" aria-checked="false">o</button></div></div>
<div id="grid"></div>
<flow-prompt-box><flow-base-prompt-box>
  <div id="slots" style="display:none"><button class="empty-chip" id="startSlot">Bắt đầu</button><button class="empty-chip">Kết thúc</button></div>
  <div id="atts"></div>
  <div id="box" role="textbox" contenteditable="true" aria-label="Bạn muốn tạo những gì?"></div>
  <button id="add" aria-label="Thêm thành phần vào ô nhập câu lệnh"><mat-icon>add</mat-icon></button>
  <flow-agent-mode-toggle-chip><button class="agent-mode-chip" aria-pressed="false">Tác nhân</button></flow-agent-mode-toggle-chip>
  <button class="settings-trigger-button" id="chip" aria-label="Điều kiện kích hoạt cài đặt"></button>
  <flow-generate-icon-button><button id="send" aria-label="Bắt đầu tạo"><mat-icon>arrow_forward</mat-icon></button></flow-generate-icon-button>
</flow-base-prompt-box></flow-prompt-box>
<div class="cdk-overlay-container"></div>
<div id="menu"><button id="upload">Tải nội dung lên</button></div>
<script>
const S = window.__flowState = { mode: 'image', vtype: 'ingredients', aspect: '9:16', dur: 6, model: 'Omni 1.1 Flash', sent: [], attachments: 0, slot: 0 };
window.__flowLog = S;
const $ = s => document.querySelector(s);
let n = 0, target = null;
function chip() {
  $('#chip').innerHTML = S.mode === 'video' ? `Video · 720p · ${S.dur} giây <mat-icon>crop_${S.aspect.replace(':', '_')}</mat-icon> x1` : `🍌 Nano Banana 2.1 <mat-icon>crop_${S.aspect.replace(':', '_')}</mat-icon> x1`;
  const frames = S.mode === 'video' && S.vtype === 'frames';
  $('#slots').style.display = frames ? '' : 'none'; $('#add').style.display = frames ? 'none' : '';
}
chip();
const radio = (on, icon, text, click) => { const b = document.createElement('button'); b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', String(on)); b.innerHTML = `<mat-icon>${icon}</mat-icon>${text}`; b.onclick = () => { click(); openSettings(); }; return b; };
function openSettings() {
  const root = $('.cdk-overlay-container'); root.innerHTML = '';
  const p = document.createElement('flow-prompt-box-settings');
  p.append(radio(S.mode === 'image', 'image', 'Hình ảnh', () => { S.mode = 'image'; }), radio(S.mode === 'video', 'videocam', 'Video', () => { S.mode = 'video'; }));
  if (S.mode === 'video') p.append(radio(S.vtype === 'frames', 'crop_free', 'Khung hình', () => { S.vtype = 'frames'; }), radio(S.vtype === 'ingredients', 'chrome_extension', 'Thành phần', () => { S.vtype = 'ingredients'; }));
  if (S.mode === 'video') {
    // Model dropdown like Flow's: a button with arrow_drop_down that opens a list of menu items.
    const dd = document.createElement('button'); dd.innerHTML = `${S.model} <mat-icon>arrow_drop_down</mat-icon>`;
    dd.onclick = () => { const menu = document.createElement('div'); menu.className = 'model-menu'; for (const m of ['Omni 1.1 Flash', 'Veo 3.1 - Lite', 'Veo 3.1 - Fast', 'Veo 3.1 - Quality']) { const item = document.createElement('button'); item.setAttribute('role', 'menuitem'); item.innerHTML = `<mat-icon>volume_up</mat-icon> ${m}`; item.onclick = () => { S.model = m; menu.remove(); openSettings(); }; menu.appendChild(item); } document.body.appendChild(menu); };
    p.append(dd);
  }
  for (const a of ['16:9', '9:16']) p.append(radio(S.aspect === a, 'crop_' + a.replace(':', '_'), a, () => { S.aspect = a; }));
  if (S.mode === 'video') for (const d of [4, 6, 8, 10]) p.append(radio(S.dur === d, '', `${d} giây`, () => { S.dur = d; }));
  p.append(radio(true, '', 'x1', () => {}));
  root.appendChild(p); chip();
}
$('#chip').onclick = () => { if ($('flow-prompt-box-settings')) { $('.cdk-overlay-container').innerHTML = ''; chip(); } else openSettings(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') { $('.cdk-overlay-container').innerHTML = ''; $('#menu').style.display = 'none'; chip(); } });
$('#add').onclick = () => { target = 'atts'; $('#menu').style.display = 'block'; };
$('#startSlot').onclick = () => { target = 'slot'; $('#menu').style.display = 'block'; };
$('#upload').onclick = () => {
  const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*,video/*';
  input.addEventListener('change', () => {
    const file = input.files[0]; if (!file) return; $('#menu').style.display = 'none';
    const isVideo = /^video\//.test(file.type);
    const img = document.createElement(isVideo ? 'video' : 'img'); img.src = URL.createObjectURL(file); if (isVideo) { S.videos = (S.videos || 0) + 1; img.muted = true; }
    if (target !== 'slot') S.attachOrder = [...(S.attachOrder || []), isVideo ? 'video' : 'image'];
    if (target === 'slot') { $('#startSlot').textContent = ''; $('#startSlot').appendChild(img); S.slot++; } else { $('#atts').appendChild(img); S.attachments++; }
    // The upload also shows up in the grid, named after the file.
    tile(isVideo ? `<video muted src="${URL.createObjectURL(file)}"></video><span>${file.name}</span>` : `<img src="${URL.createObjectURL(file)}"><span>${file.name}</span>`);
  });
  input.click();
};
function tile(html) { const t = document.createElement('flow-grid-tile-container'); t.innerHTML = html; $('#grid').prepend(t); return t; }
$('#gear').onclick = () => { $('#gearMenu').style.display = $('#gearMenu').style.display === 'none' ? 'block' : 'none'; };
$('#silentSwitch').onclick = () => { S.silentFallback = !S.silentFallback; $('#silentSwitch').setAttribute('aria-checked', String(S.silentFallback)); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#gearMenu').style.display = 'none'; });
$('#send').onclick = () => {
  const text = $('#box').innerText.trim(); if (!text) return;
  const order = (S.attachOrder || []).join(','); S.attachOrder = [];
  S.sent.push({ order, text, mode: S.mode, model: S.mode === 'video' ? S.model : '', vtype: S.vtype, aspect: S.aspect, dur: S.dur, attachments: $('#atts').querySelectorAll('img').length, videos: $('#atts').querySelectorAll('video').length, slot: $('#startSlot').querySelectorAll('img').length });
  $('#box').textContent = ''; $('#atts').innerHTML = ''; $('#startSlot').textContent = 'Bắt đầu';
  const t = tile('<span>Đang tạo 10%</span>');
  if (/AUDIOFAIL/.test(text) && !S.silentFallback) { setTimeout(() => { t.innerHTML = '<span>warning Không thành công Không tạo được âm thanh. Vui lòng thử một câu lệnh khác hoặc gửi ý kiến phản hồi.</span>'; }, 800); return; }
  if (/AUDIOFAIL/.test(text)) { n++; setTimeout(() => { t.innerHTML = `<video muted src="/media/silent${n}.mp4"></video><span>Video ${n}</span>`; }, 1500); return; }
  if (/BLOCKME/.test(text)) { setTimeout(() => { t.innerHTML = '<span>Chúng tôi phát hiện thấy hoạt động bất thường.</span>'; }, 800); return; }
  if (/FAILME/.test(text)) { setTimeout(() => { t.innerHTML = '<span>Không tạo được. Đã xảy ra lỗi.</span>'; }, 800); return; }
  n++;
  setTimeout(() => { t.innerHTML = S.mode === 'video' ? `<video muted src="/media/clip${n}.mp4"></video><span>Video ${n}</span>` : `<img src="/media/img${n}.png"><span>Ảnh ${n}</span>`; }, 1500);
};
</script></body></html>
